name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # The call pipeline is tested with fake models, so the heavy model
        # packages (pocket-tts, onnx-asr) are left out here.
        run: pip install -e ".[dev]" "pipecat-ai[runner,webrtc,openai]==1.17.0"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
